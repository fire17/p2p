<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="p2p">
  <!-- p2p mark: two nodes joined by a secured link, a padlock clamped on the link.
       teal + mid-gray two-tone so it reads on light AND dark tabs;
       fat strokes + big gaps so the motif survives at 16px. -->
  <g fill="none" stroke-linecap="round">
    <path d="M12 52 L52 12" stroke="#14b8a6" stroke-width="7"/>
    <path d="M27 27 a5.5 5.5 0 0 1 11 0 v3" stroke="#64748b" stroke-width="4.5"/>
    <rect x="23.5" y="28.5" width="18" height="14" rx="4" fill="#64748b"/>
    <rect x="31" y="33" width="3" height="5.5" rx="1.5" fill="#f1f5f9"/>
    <circle cx="11" cy="53" r="8" fill="#14b8a6"/>
    <circle cx="53" cy="11" r="8" fill="#64748b"/>
  </g>
</svg>
