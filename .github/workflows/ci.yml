name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # deterministic unit tests only; test/gate/* hit live public infra (DHT/trackers) and
      # are run manually, not in CI (network-dependent by design).
      - run: node --test test/*.test.js
