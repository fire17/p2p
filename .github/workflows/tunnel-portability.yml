name: tunnel portability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tunnel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tunnel unit and isolated process tests
        shell: bash
        run: node --test test/tunnel*.test.js
      - name: Windows first install and generated launchers (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./test/installer-windows.ps1 -PowerShellCommand pwsh
          ./test/installer-downloads.ps1 -PowerShellCommand pwsh
      - name: Windows first install and generated launchers (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./test/installer-windows.ps1 -PowerShellCommand powershell.exe
          ./test/installer-downloads.ps1 -PowerShellCommand powershell.exe
