name: join bootstrap
on: [push, pull_request]
permissions:
  contents: read
jobs:
  join:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install-and-join HTTP entrypoints and legacy identities
        env:
          P2P_TEST_BUN: bun
          P2P_REQUIRE_JOIN_BUN: '1'
          P2P_REQUIRE_WINDOWS_SHELLS: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: node --test test/join-bootstrap.test.js test/join-legacy.test.js
